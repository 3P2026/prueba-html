<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Fotos y GPS con Firebase</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; }
        .btn { color: white; padding: 15px 30px; font-size: 18px; border: none; border-radius: 8px; cursor: pointer; margin-top: 20px; text-decoration: none; display: inline-block; }
        #start-btn { background-color: #4CAF50; }
        #start-btn:hover { background-color: #45a049; }
        #maps-btn { background-color: #4285F4; display: none; }
        #maps-btn:hover { background-color: #357ae8; }
        #status { margin-top: 20px; font-weight: bold; color: #333; }
    </style>
</head>
<body>

    <h1>App con Base de Datos en la Nube 📸📍</h1>
    <p>Toma una foto: se guardará la imagen, tus coordenadas y abrirá el mapa.</p>

    <input type="file" accept="image/*" capture="environment" id="camera-input" style="display: none;">
    <button id="start-btn" class="btn">Tomar Foto y Guardar</button>
    <div id="status"></div>
    <a id="maps-btn" class="btn" target="_blank">Ver en Google Maps 🗺️</a>

    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://gstatic.com";
        import { getFirestore, collection, addDoc } from "https://gstatic.com";

        // Configuración oficial de tu proyecto Firebase
        const firebaseConfig = {
          apiKey: "AIzaSyAth4bQAEcjrbS4ha6qGKLw-h2rzg24tmQ",
          authDomain: "app-fotos-gps.firebaseapp.com",
          projectId: "app-fotos-gps",
          storageBucket: "app-fotos-gps.firebasestorage.app",
          messagingSenderId: "737555190343",
          appId: "1:737555190343:web:2342ebc29b686ccee29762"
        };

        // Inicializamos Firebase y sus herramientas
        const app = initializeApp(firebaseConfig);
        const storage = getStorage(app);
        const db = getFirestore(app);

        const startBtn = document.getElementById('start-btn');
        const cameraInput = document.getElementById('camera-input');
        const statusDiv = document.getElementById('status');
        const mapsBtn = document.getElementById('maps-btn');

        let fotoArchivo = null;

        startBtn.addEventListener('click', () => {
            cameraInput.click();
        });

        cameraInput.addEventListener('change', (e) => {
            // Accedemos al primer archivo seleccionado de la cámara [0]
            fotoArchivo = e.target.files[0];
            if (fotoArchivo) {
                statusDiv.innerText = "Foto lista. Obteniendo ubicación GPS...";
                mapsBtn.style.display = "none";
                obtenerUbicacion();
            }
        });

        function obtenerUbicacion() {
            if (!navigator.geolocation) {
                statusDiv.innerText = "Error: Tu navegador no soporta GPS.";
                return;
            }
            navigator.geolocation.getCurrentPosition(procesarTodo, manejarError);
        }

        async function procesarTodo(posicion) {
            const latitud = posicion.coords.latitude.toFixed(6);
            const longitud = posicion.coords.longitude.toFixed(6);
            
            try {
                statusDiv.innerText = "Subiendo foto a Firebase Storage... ⏳";
                
                // 1. Subimos el archivo de la foto a la nube con un nombre único basado en el tiempo
                const nombreUnico = `${Date.now()}_${fotoArchivo.name}`;
                const storageRef = ref(storage, `fotos/${nombreUnico}`);
                await uploadBytes(storageRef, fotoArchivo);
                
                // Obtenemos la dirección web (URL) de la foto ya subida
                const fotoUrl = await getDownloadURL(storageRef);

                statusDiv.innerText = "Guardando coordenadas en la Base de Datos (Firestore)... 💾";

                // 2. Guardamos un registro con los datos en la base de datos Firestore
                await addDoc(collection(db, "registros_gps"), {
                    lat: latitud,
                    lon: longitud,
                    foto: fotoUrl,
                    fecha: new Date().toISOString()
                });

                statusDiv.innerText = "¡Todo guardado en la nube con éxito! 🎉 Ready.";

                // 3. Preparamos el botón para saltar a la app nativa de Google Maps
                const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
                mapsBtn.href = isIOS 
                    ? `comgooglemaps://?q=${latitud},${longitud}&zoom=15` 
                    : `geo:${latitud},${longitud}?q=${latitud},${longitud}(Mi+Foto)`;
                
                mapsBtn.style.display = "inline-block";

            } catch (error) {
                console.error(error);
                statusDiv.innerText = "Error al conectar con Firebase: " + error.message;
            }
        }

        function manejarError(error) {
            statusDiv.innerText = "Error de GPS: " + error.message;
        }
    </script>
</body>
</html>
