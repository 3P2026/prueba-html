<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Fotos y GPS con Firebase</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding: 20px; 
            background-color: #f4f4f9; 
        }
        /* Diseñamos el input de archivo directamente como un botón real sin trucos raros de ocultación */
        #camera-input {
            background-color: #4CAF50;
            color: white;
            padding: 15px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 90%;
        }
        .btn-maps { 
            background-color: #4285F4; 
            color: white; 
            padding: 15px 30px; 
            font-size: 18px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            margin-top: 20px; 
            text-decoration: none; 
            display: none; 
        }
        .btn-maps:hover { background-color: #357ae8; }
        #status { 
            margin-top: 20px; 
            font-weight: bold; 
            color: #333; 
            padding: 12px; 
            border-radius: 5px; 
            background-color: #eaeaea; 
        }
    </style>
</head>
<body>

    <h1>App con Base de Datos en la Nube 📸📍</h1>
    <p>Presiona el botón "Seleccionar archivo" para abrir tu cámara, tomar la foto y guardar todo.</p>

    <!-- El botón es el input nativo directo para evitar bloqueos del sistema operativo -->
    <input type="file" accept="image/*" capture="environment" id="camera-input">
    
    <div id="status">Listo para empezar. Elige tu foto.</div>
    <a id="maps-btn" class="btn-maps" target="_blank">Ver en Google Maps 🗺️</a>

    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://gstatic.com";
        import { getFirestore, collection, addDoc } from "https://gstatic.com";

        // Tus credenciales verificadas
        const firebaseConfig = {
          apiKey: "AIzaSyAth4bQAEcjrbS4ha6qGKLw-h2rzg24tmQ",
          authDomain: "://firebaseapp.com",
          projectId: "app-fotos-gps",
          storageBucket: "app-fotos-gps.firebasestorage.app",
          messagingSenderId: "737555190343",
          appId: "1:737555190343:web:2342ebc29b686ccee29762"
        };

        const app = initializeApp(firebaseConfig);
        const storage = getStorage(app);
        const db = getFirestore(app);

        const cameraInput = document.getElementById('camera-input');
        const statusDiv = document.getElementById('status');
        const mapsBtn = document.getElementById('maps-btn');

        cameraInput.addEventListener('change', (e) => {
            // Verificamos y extraemos de forma estricta el archivo individual [0]
            if (e.target.files && e.target.files.length > 0) {
                const fotoArchivo = e.target.files[0]; 
                statusDiv.style.backgroundColor = "#fff3cd";
                statusDiv.innerText = `Foto "${fotoArchivo.name}" recibida. Solicitando localización GPS...`;
                mapsBtn.style.display = "none";
                obtenerUbicacion(fotoArchivo);
            } else {
                statusDiv.innerText = "No se detectó ningún archivo.";
            }
        });

        function obtenerUbicacion(archivoParaSubir) {
            if (!navigator.geolocation) {
                statusDiv.innerText = "Error: Tu navegador no soporta GPS.";
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (posicion) => procesarTodo(posicion, archivoParaSubir), 
                manejarError, 
                { enableHighAccuracy: true, timeout: 15000 }
            );
        }

        async function procesarTodo(posicion, archivoParaSubir) {
            const latitud = posicion.coords.latitude.toFixed(6);
            const longitud = posicion.coords.longitude.toFixed(6);
            
            try {
                statusDiv.innerText = "Subiendo archivo a Firebase Storage... ⏳";
                
                const nombreUnico = `${Date.now()}_${archivoParaSubir.name}`;
                const storageRef = ref(storage, `fotos/${nombreUnico}`);
                
                // SOLUCIÓN FIX: Pasamos el archivo binario individual limpio [0]
                await uploadBytes(storageRef, archivoParaSubir);
                const fotoUrl = await getDownloadURL(storageRef);

                statusDiv.innerText = "Guardando coordenadas en Firestore Database... 💾";

                // Guardamos en la colección de texto
                await addDoc(collection(db, "registros_gps"), {
                    lat: latitud,
                    lon: longitud,
                    foto: fotoUrl,
                    fecha: new Date().toISOString()
                });

                statusDiv.style.backgroundColor = "#d4edda";
                statusDiv.innerText = "¡Todo guardado en la nube con éxito! 🎉 Ready.";

                // Enlace nativo directo según el dispositivo móvil
                const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
                mapsBtn.href = isIOS 
                    ? `comgooglemaps://?q=${latitud},${longitud}&zoom=15` 
                    : `geo:${latitud},${longitud}?q=${latitud},${longitud}(Mi+Foto)`;
                
                mapsBtn.style.display = "inline-block";

            } catch (error) {
                console.error(error);
                statusDiv.style.backgroundColor = "#f8d7da";
                statusDiv.innerText = "Error crítico en Firebase: " + error.message;
            }
        }

        function manejarError(error) {
            statusDiv.style.backgroundColor = "#f8d7da";
            statusDiv.innerText = "Error de GPS: " + error.message + ". Verifica que tu móvil tenga el GPS activo.";
        }
    </script>
</body>
</html>
