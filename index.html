<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foto y Ubicación con APIs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f4f4f9;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover { background-color: #45a049; }
        #maps-btn {
            background-color: #4285F4;
            display: none; /* Oculto al inicio */
        }
        #maps-btn:hover { background-color: #357ae8; }
        #status {
            margin-top: 20px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <h1>Mi Primer App de APIs 📸📍</h1>
    <p>Presiona el botón para tomar una foto y ubicarte en el mapa.</p>

    <input type="file" accept="image/*" capture="environment" id="camera-input" style="display: none;">
    
    <button id="start-btn" class="btn">Tomar Foto y Ubicar</button>
    
    <div id="status"></div>

    <!-- Este botón llevará directamente a Google Maps sin que el navegador lo bloquee -->
    <a id="maps-btn" class="btn" target="_blank">Ver en Google Maps 🗺️</a>

    <script>
        const startBtn = document.getElementById('start-btn');
        const cameraInput = document.getElementById('camera-input');
        const statusDiv = document.getElementById('status');
        const mapsBtn = document.getElementById('maps-btn');

        startBtn.addEventListener('click', () => {
            cameraInput.click();
        });

        cameraInput.addEventListener('change', () => {
            statusDiv.innerText = "Foto capturada con éxito. Obteniendo ubicación GPS...";
            mapsBtn.style.display = "none"; // Por si repiten el proceso
            obtenerUbicacion();
        });

        function obtenerUbicacion() {
            if (!navigator.geolocation) {
                statusDiv.innerText = "Lo siento, tu navegador no soporta Geolocalización.";
                return;
            }
            navigator.geolocation.getCurrentPosition(progresoExitoso, manejarError);
        }

        function progresoExitoso(posicion) {
            const latitud = posicion.coords.latitude;
            const longitud = posicion.coords.longitude;
            
            statusDiv.innerText = `¡Ubicación encontrada! Lat: ${latitud}, Lon: ${longitud}.`;

            // Configuramos el enlace directo en el botón de Google Maps
            mapsBtn.href = `https://google.com{latitud},${longitud}`;
            
            // Mostramos el botón azul para que el usuario haga clic voluntariamente
            mapsBtn.style.display = "inline-block";
        }

        function manejarError(error) {
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    statusDiv.innerText = "Error: Debes permitir el acceso al GPS en tu navegador.";
                    break;
                case error.POSITION_UNAVAILABLE:
                    statusDiv.innerText = "Error: La información de ubicación no está disponible.";
                    break;
                case error.TIMEOUT:
                    statusDiv.innerText = "Error: Se agotó el tiempo de espera.";
                    break;
                default:
                    statusDiv.innerText = "Ocurrió un error desconocido al buscar la ubicación.";
                    break;
            }
        }
    </script>
</body>
</html>
